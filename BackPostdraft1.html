<label>Visibility</label><select onchange="S.me.priv=this.value">${['Visible to all regions','Hide from my current region','Paused — hide from scouts'].map(x=>`<option ${m.priv==x?'selected':''}>${x}</option>`)}</select>

function more(pid,id){om(`<h2>Options</h2><div class="row">${pid=='me'?`<button onclick="cm();delp(${id})">Delete post</button>`:`<button class="g" onclick="cm();rep(${pid})">Report</button><button class="g" onclick="cm();blk(${pid})">Block ${P.find(q=>q.id==pid).n}</button>`}</div>`)}
function postCard(x){const p=x.pid=='me'?S.me:P.find(q=>q.id==x.pid);if(S.blocked.has(x.pid))return '';
return `<div class="card"><div class="row"><div class="av">${ini(p.n)}</div><div><b>${p.n}</b> <span class="tag ${tag(vs(p))}">${vs(p)}</span><br><span class="mut">${x.type} · ${x.pid=='me'?'just now':'2d'}</span></div><button class="g sm sp" aria-label="More options" onclick="more('${x.pid}',${x.id})">⋯</button></div>
<p>${x.txt}</p>${x.url?`<video src="${x.url}" controls></video>`:x.vid?'<div class="vid"><b>▶</b></div>':''}
<div class="row"><button class="sm g" onclick="like(${x.id})">${x.liked?'♥':'♡'} ${x.likes+x.liked}</button><button class="sm g" onclick="cmt(${x.id})">Comment${x.cm.length?' ('+x.cm.length+')':''}</button><button class="sm g" onclick="toast('Shared to Instagram and X (demo)')">Share</button><button class="sm g" onclick="bm(${x.id})">${S.bm.has(x.id)?'★ Saved':'☆ Save'}</button>${x.pid!='me'&&!S.fol.has(x.pid)?`<button class="sm sp" onclick="fol(${x.pid})">Follow</button>`:''}</div>${x.cm.map(c=>`<div class="mut" style="margin-top:6px"><b>You:</b> ${c}</div>`).join('')}</div>`}
function feed(){const list=POSTS.filter(x=>x.g==S.g&&(S.ptab=='disc'||x.pid=='me'||S.fol.has(x.pid))&&(!S.regs.length||x.pid=='me'||S.regs.includes(P.find(p=>p.id==x.pid).reg)));
return `<div class="row" style="margin-bottom:14px"><div class="seg"><button class="${S.ptab=='foll'?'on':''}" onclick="S.ptab='foll';render()">Following</button><button class="${S.ptab=='disc'?'on':''}" onclick="S.ptab='disc';render()">Discover</button></div>${rb()}<button class="sp" onclick="${S.role=='player'?'compose()':'trial()'}">＋ ${S.role=='player'?'Post':'Trial'}</button></div>${list.map(postCard).join('')||'<div class="card mut">Nothing here yet. Follow players or switch to Discover.</div>'}`}
function discover(){const f=S.f;let l=P.filter(p=>p.g==S.g&&(!S.regs.length||S.regs.includes(p.reg))&&(!f.pos||p.pos==f.pos)&&(!f.av||p.av==f.av)&&(!f.ver||p.v==1)&&(!f.age||(f.age=='u18'?p.age<18:p.age>=18))&&(!f.q||p.n.toLowerCase().includes(f.q.toLowerCase())));
const op=(a,k)=>a.map(x=>`<option ${f[k]==x?'selected':''}>${x}</option>`).join('');
return `<div class="row" style="margin-bottom:12px"><input placeholder="Search players" value="${f.q}" oninput="S.f.q=this.value;render(1)" style="flex:1;min-width:150px"><button class="g sm" onclick="S.sf^=1;render()">Filters</button>${rb()}</div>${S.sf?`<div class="card"><div class="row"><select onchange="S.f.pos=this.value;render()"><option value="">Position</option>${op(['Goalkeeper','Full-back','Centre-back','Midfielder','Winger','Striker'],'pos')}</select><select onchange="S.f.av=this.value;render()"><option value="">Availability</option>${op(['Open to trials','Open to offers','Out of contract','Committed','Not looking'],'av')}</select><select onchange="S.f.age=this.value;render()"><option value="">Age</option><option value="u18" ${f.age=='u18'?'selected':''}>Under 18</option><option value="o18" ${f.age=='o18'?'selected':''}>18+</option></select></div><label style="font-weight:500"><input type="checkbox" style="width:auto" ${f.ver?'checked':''} onchange="S.f.ver=this.checked;render()"> Verified players only</label>${S.role=='scout'?`<button class="sm g" style="margin-top:8px" onclick="S.saved.push((f.pos||'Any position')+' · '+(f.av||'Any availability')+' · '+(S.regs.join(', ')||'Any region'));toast('Search saved — you\\'ll be alerted on new matches')">Save this search</button>`:''}</div>`:''}${l.map(p=>pcard(p)).join('')||'<div class="card mut">No players match. Loosen a filter.</div>'}`}
function tabs(){return S.role=='guardian'?[['feed','Messages']]:[['feed',tr('feed')],['disc',S.role=='scout'?tr('scout'):tr('people')],['trials','Trials'],...(S.role=='scout'?[['short','Shortlist']]:[]),['me',tr('me')],['al',tr('al')]]}
function trialsBoard(){const l=POSTS.filter(x=>x.type=='Trial'&&x.g==S.g);return `<div class="row" style="margin-bottom:12px"><h2 style="margin:0">Trial & ID camp board</h2>${S.role=='scout'?`<button class="sp" onclick="trial()">＋ Post trial</button>`:''}</div>${l.map(x=>`<div class="card"><b>${x.txt.split(':')[0]}</b><p class="mut">${x.txt}</p><button class="sm" onclick="toast('Application sent')">Apply</button></div>`).join('')||'<div class="card mut">No open trials match your regions yet.</div>'}`}
function body(){const t=S.role=='guardian'?'guardian':S.tab,m=S.role=='scout'?S.sc:S.me,sub=['ver','adm'].includes(t);
const strip=S.role!='guardian'&&m.v!='verified'&&!sub?`<div class="card row" style="background:var(--blue)"><span>${m.v=='pending'?'Verification under review.':m.v=='rejected'?'Verification rejected. Please try again.':S.role=='scout'?'Verify to message players and post trials.':'Unverified: scouts cannot see you yet.'}</span>${m.v!='pending'?`<button class="sm sp" style="background:var(--bg)" onclick="go('ver')">${tr('ver')}</button>`:''}</div>`:'';
const main={feed:feed,disc:discover,short:shortlist,me:myProf,ver:verify,al:alerts,adm:adm,guardian:guardian,trials:trialsBoard}[t]();
return (sub?`<button class="g sm" style="margin-bottom:12px" onclick="go('feed')">← Back</button>`:'')+strip+main}
function fin(){if(rl=='player'){S.dob=+($('#by').value||2007);S.minor=2026-S.dob<18;S.me.age=2026-S.dob}S.role=rl;S.gate=0;S.tab='feed';cm();render();setTimeout(guide,150)}
function render(keep){if(S.gate){$('#app').innerHTML=gate();return}const q=keep&&document.activeElement.tagName=='INPUT'?document.activeElement.selectionStart:null;
$('#app').dir=S.lang=='ar'?'rtl':'ltr';document.documentElement.setAttribute('data-theme',S.dark?'dark':'light');
$('#app').innerHTML=`<header><div class="bar"><div class="logo">${WORD}</div>
<div class="seg"><button class="${S.g=='m'?'on':''}" onclick="S.g='m';render()">Men</button><button class="${S.g=='w'?'on':''}" onclick="S.g='w';render()">Women</button></div><button class="g" aria-label="How it works" onclick="guide()">?</button><button class="g" onclick="menu()">Menu</button></div>
<nav>${tabs().map(([k,l])=>`<button class="${S.tab==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</nav></header><main>${body()}</main>`;
if(q!==null){const i=document.querySelector('input[placeholder="Search players"]');if(i){i.focus();i.setSelectionRange(q,q)}}}
render();
</script></body></html>
